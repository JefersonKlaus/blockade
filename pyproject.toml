[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "guerra-dos-blocos"
version = "0.1.0"
description = "Jogo de tabuleiro por turnos: espreme os blocos do adversario e vire-os para o seu lado."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flet>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

# Configuracao lida pelo comando `flet run` (e depois por `flet build`).
[tool.flet]
org = "dev.guerradosblocos"
product = "Guerra dos Blocos"
copyright = "Copyright (c) 2026"

[tool.flet.app]
path = "src"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
